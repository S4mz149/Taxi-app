<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Taxi RP - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🚖 Taxi RP</h1>

    <div class="card">
        <h2>Connexion</h2>
        <input id="loginUser" placeholder="Utilisateur">
        <input id="loginPass" type="password" placeholder="Mot de passe">
        <button onclick="login()">Se connecter</button>
    </div>

    <div class="card">
        <h2>Créer un compte</h2>
        <input id="regUser" placeholder="Utilisateur">
        <input id="regPass" type="password" placeholder="Mot de passe">
        <button onclick="register()">Créer</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
